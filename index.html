<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Challenge | Algemene Kennis</title>
    <meta
      name="description"
      content="Speel een quiz met 20 algemene kennisvragen en stuur je score naar janali3765@gmail.com."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Quiz Challenge</div>
      </header>

      <main class="quiz-card">
        <section class="intro">
          <p class="eyebrow">Algemene kennis</p>
          <h1>20 vragen over de wereld om je heen</h1>
          <p class="subtitle">
            Test je kennis, ontdek je score en stuur je resultaten direct naar
            <strong>janali3765@gmail.com</strong>.
          </p>
        </section>

        <div class="meta-bar">
          <span id="progress-indicator">0 / 20 beantwoord</span>
          <span id="score-indicator">Score: 0</span>
        </div>

        <form id="quiz-form" novalidate>
          <div id="questions" class="questions"></div>

          <div class="actions">
            <button id="submit-btn" type="submit">Verstuur quiz</button>
          </div>
        </form>

        <div id="result" class="result" aria-live="polite"></div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
