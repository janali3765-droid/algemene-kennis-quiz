<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algemene Kennisquiz</title>
    <meta name="description" content="Beantwoord 20 algemene kennisvragen." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar"><span class="brand">Quiz Challenge</span></header>

      <section class="quiz-card">
        <div class="intro">
          <p class="eyebrow">Algemene kennis</p>
          <h1>Beantwoord de 20 vragen</h1>
          <p class="subtitle">Kies steeds één antwoord. Na de laatste vraag ga je naar de bedankpagina.</p>
        </div>

        <div class="meta-bar">
          <span id="progress">0 / 20 beantwoord</span>
          <span id="score">Score: 0</span>
        </div>

        <form id="quiz-form">
          <div id="questions" class="questions"></div>
          <div class="actions">
            <button type="submit">Quiz afronden</button>
          </div>
        </form>
        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
